# Apache site for servers.dog. Install to /etc/apache2/sites-available/servers.dog.conf
# and enable with `a2ensite servers.dog` (see DEPLOY.md).
#
# Apache terminates TLS with the Cloudflare Origin Certificate and proxies everything to
# ServerDog on 127.0.0.1:8080. Do not add Header, Expires or mod_cache rules here: ServerDog
# sets Cache-Control on every response, and Cloudflare caches by those headers.
# Only Cloudflare can reach ports 80/443 (ufw, CLOUDFLARE.md step 7), and the visitor's real
# address comes from the shared conf-enabled/cloudflare-remoteip.conf.
# Needs: a2enmod ssl proxy proxy_http remoteip

<VirtualHost *:80>
    ServerName servers.dog
    ServerAlias www.servers.dog
    # Cloudflare's "Always Use HTTPS" normally redirects before reaching us.
    Redirect permanent / https://servers.dog/
</VirtualHost>

<VirtualHost *:443>
    ServerName servers.dog
    ServerAlias www.servers.dog

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/servers.dog.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/servers.dog.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog  ${APACHE_LOG_DIR}/servers.dog-error.log
    CustomLog ${APACHE_LOG_DIR}/servers.dog-access.log combined
</VirtualHost>
