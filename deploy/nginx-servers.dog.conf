# nginx site for servers.dog. Install to /etc/nginx/sites-available/servers.dog and enable it
# with a symlink in sites-enabled (see DEPLOY.md step 5).
#
# nginx terminates TLS with the Cloudflare Origin Certificate and proxies everything to
# ServerDog on 127.0.0.1:8080. Do not add expires, add_header Cache-Control or proxy_cache here:
# ServerDog sets Cache-Control on every response, and Cloudflare caches by those headers.
# Only Cloudflare can reach ports 80/443 (ufw, CLOUDFLARE.md step 7), and the visitor's real
# address comes from the shared /etc/nginx/conf.d/cloudflare-realip.conf.

server {
    listen 80;
    listen [::]:80;
    server_name servers.dog www.servers.dog;
    # Cloudflare's "Always Use HTTPS" normally redirects before reaching us.
    return 301 https://servers.dog$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name servers.dog www.servers.dog;

    ssl_certificate     /etc/ssl/cloudflare/servers.dog.pem;
    ssl_certificate_key /etc/ssl/cloudflare/servers.dog.key;

    access_log /var/log/nginx/servers.dog-access.log;
    error_log  /var/log/nginx/servers.dog-error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
